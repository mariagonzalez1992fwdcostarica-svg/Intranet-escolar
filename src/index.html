<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet Escolar — Inicio de Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Intranet Escolar — Centro Educativo Público</h1>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h2>Acceso al Sistema</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="role">Selecciona tu Rol:</label>
                    <select id="role" name="role" required>
                        <option value="" disabled selected>-- Selecciona un perfil --</option>
                        <option value="admin">Administrador</option>
                        <option value="docente">Personal Docente</option>
                        <option value="estudiante">Estudiante / Familia</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico Institutional:</label>
                    <input type="email" id="email" name="email" placeholder="usuario@escuela.edu" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-primary">Ingresar a la Intranet</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Intranet Escolar. Sistema de gestión pública protegida.</p>
    </footer>
</body>

</html>
